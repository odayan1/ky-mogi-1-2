<style>
  :root{
    --blue:#2fbdea; --blue-d:#1aa3d0; --green:#8dc63f; --green-d:#5e9022; --yellow:#f7d000;
    --ink:#2b3a45; --muted:#6b7c88; --bg:#f4fbfe; --card:#ffffff;
    --line:#e4eef4; --good:#38b26b; --bad:#e8624a;
    --shadow:0 6px 22px rgba(28,120,160,.10);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
       color:var(--ink);background:linear-gradient(180deg,#eaf7fd 0%,var(--bg) 260px);
       -webkit-font-smoothing:antialiased;padding-bottom:80px;}
  /* Header */
  header{background:var(--card);border-bottom:3px solid var(--blue);box-shadow:0 2px 12px rgba(28,120,160,.08);position:sticky;top:0;z-index:50;}
  .head-inner{max-width:840px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .title-wrap h1{margin:0;font-size:1.3rem;letter-spacing:.5px;}
  .title-wrap .sub{color:var(--muted);font-size:.78rem;margin-top:2px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand img{height:88px;width:auto;display:block;}
  .brand .tag{font-size:.9rem;font-weight:800;color:var(--green);text-align:right;line-height:1.35;}
  .brand .tag small{display:block;font-size:.66rem;font-weight:600;color:var(--muted);margin-top:2px;}
  main{max-width:840px;margin:0 auto;padding:0 20px 40px;}
  /* Control card */
  .ctrl{background:var(--card);border-radius:16px;padding:16px 18px;margin:18px 0 6px;box-shadow:var(--shadow);border:1px solid var(--line);}
  .pinfo{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-weight:700;margin-bottom:6px;}
  .bar{height:10px;background:#e9f3f8;border-radius:8px;overflow:hidden;border:1px solid var(--line);}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--blue));border-radius:8px;transition:width .3s;}
  .reroll{margin-top:12px;width:100%;padding:12px;border:0;border-radius:26px;background:var(--yellow);color:#6b5900;font-weight:800;font-size:1rem;cursor:pointer;box-shadow:var(--shadow);}
  .reroll:hover{filter:brightness(.97);}
  .note{font-size:.76rem;color:var(--muted);line-height:1.7;margin-top:12px;background:#fffdf0;border:1px dashed var(--yellow);border-radius:10px;padding:10px 12px;}
  .clear{background:linear-gradient(90deg,#eafaf0,#eaf7fd);border:2px solid var(--green);border-radius:16px;padding:16px;text-align:center;margin:14px 0;box-shadow:var(--shadow);}
  /* Tabs */
  .tabs{display:flex;gap:10px;margin:16px 0 0;}
  .tab{flex:1;padding:12px 8px;border:none;border-radius:14px 14px 0 0;cursor:pointer;font-size:1rem;font-weight:800;background:#dceef6;color:var(--muted);border-bottom:4px solid transparent;transition:.15s;font-family:inherit;}
  .tab.active{background:var(--card);color:var(--blue-d);border-bottom-color:var(--blue);box-shadow:var(--shadow);}
  .panel{display:none;animation:fade .25s ease;}
  .panel.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  /* Problem card */
  .card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden;margin:14px 0;}
  .card.done{border-color:var(--green);}
  .chead{width:100%;padding:16px 18px;display:flex;align-items:flex-start;gap:12px;text-align:left;background:none;border:0;cursor:pointer;font:inherit;color:inherit;}
  .num{flex:0 0 auto;width:34px;height:34px;border-radius:999px;background:var(--blue);color:#fff;font-weight:800;font-size:.85rem;display:flex;align-items:center;justify-content:center;}
  .card.done .num{background:var(--green);}
  .q{flex:1;line-height:1.95;padding-top:3px;font-size:1rem;}
  .caret{color:var(--muted);margin-top:4px;}
  .cbody{padding:0 18px 18px;}
  .figbox{background:#f7fcff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px;text-align:center;}
  .figbox p{font-size:.72rem;color:var(--muted);font-weight:700;margin:0 0 6px;}
  .lead{font-size:.9rem;font-weight:700;color:var(--blue-d);margin:0 0 10px;}
  .choices{display:grid;grid-template-columns:1fr;gap:10px;}
  @media(min-width:520px){.choices{grid-template-columns:1fr 1fr;}}
  .choice{display:flex;align-items:center;gap:10px;padding:13px 12px;border:2px solid var(--line);border-radius:14px;background:#fff;font-size:1.05rem;cursor:pointer;font-family:inherit;text-align:left;transition:.12s;}
  .choice:hover{border-color:var(--blue);background:#f2fbfe;}
  .choice .lb{width:26px;height:26px;border-radius:999px;background:#eaf7fd;color:var(--blue-d);font-size:.8rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .choice.ok{border-color:var(--good);background:#eafaf0;}
  .choice.ng{border-color:var(--bad);background:#fdeeea;}
  .choice.dim{border-color:var(--line);background:#fafdff;opacity:.6;}
  .choice[disabled]{cursor:default;}
  .mark{margin-left:auto;font-weight:800;}
  .mark.g{color:var(--good);}.mark.r{color:var(--bad);}
  .verdict{margin-top:10px;font-size:.9rem;font-weight:800;}
  .verdict.g{color:var(--good);}.verdict.r{color:var(--bad);}
  .steps{background:#fffdf0;border:1px dashed var(--yellow);border-radius:12px;padding:14px;margin-top:14px;}
  .steps>.t{display:flex;align-items:center;gap:6px;font-size:.88rem;font-weight:800;color:#8a7400;margin:0 0 10px;}
  .step{display:flex;gap:10px;font-size:.92rem;background:#fff;border-radius:10px;padding:10px;line-height:1.9;margin-bottom:8px;border:1px solid var(--line);}
  .step .n{flex:0 0 auto;width:22px;height:22px;border-radius:999px;background:var(--yellow);color:#6b5900;font-size:.8rem;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;}
  .btn{width:100%;padding:11px;border:0;border-radius:22px;background:var(--blue);color:#fff;font-weight:800;font-size:.92rem;cursor:pointer;font-family:inherit;box-shadow:var(--shadow);}
  .btn:hover{background:var(--blue-d);}
  .ansbox{margin-top:10px;display:flex;align-items:center;gap:10px;background:#eafaf0;border:2px solid var(--good);border-radius:12px;padding:13px;}
  .ansbox b{font-size:1.1rem;}
  .donebtn{width:100%;margin-top:14px;padding:13px;border:0;border-radius:26px;background:var(--green);color:#fff;font-weight:800;font-size:1rem;cursor:pointer;font-family:inherit;box-shadow:var(--shadow);}
  .donebtn:hover{background:var(--green-d);}
  .footer-note{text-align:center;color:var(--muted);font-size:.76rem;margin:26px 0 0;}
  .fixed{position:fixed;bottom:16px;right:16px;background:var(--blue);color:#fff;font-weight:800;padding:8px 16px;border-radius:999px;box-shadow:var(--shadow);font-size:.82rem;z-index:20;}
  /* math */
  .math{font-family:Georgia,"Times New Roman",serif;white-space:nowrap;}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;font-size:.85em;}
  .frac .fn{padding:0 4px;border-bottom:1.5px solid currentColor;line-height:1.15;}
  .frac .fd{padding:0 4px;line-height:1.15;}
  .sqrt{display:inline-flex;align-items:stretch;}
  .sqrt .rad{border-top:1.5px solid currentColor;padding:0 2px;}
  .math em{font-style:italic;}
  sup{font-size:.7em;}
  /* interactive */
  .dia{background:#f7fcff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px;}
  .wtitle{font-size:.9rem;font-weight:800;color:var(--blue-d);margin:0 0 10px;}
  .srow{display:flex;flex-direction:column;gap:10px;align-items:center;}
  @media(min-width:520px){.srow{flex-direction:row;}}
  .ssvg{flex:0 0 auto;}
  .sctrl{width:100%;}
  .slider{width:100%;accent-color:var(--blue);margin:6px 0;}
  .sinfo{font-size:.9rem;margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;line-height:2.1;}
  .hit{color:var(--good);font-weight:800;}
  .setbtn{margin-top:8px;font-size:.8rem;background:var(--blue);color:#fff;border:0;padding:7px 16px;border-radius:999px;cursor:pointer;}
  .nav{display:flex;gap:8px;margin-top:10px;}
  .nav button{flex:1;padding:9px;border:0;border-radius:22px;font-size:.9rem;font-weight:800;cursor:pointer;font-family:inherit;}
  .nav .prev{background:#e2eef5;color:var(--muted);}
  .nav .next{background:var(--blue);color:#fff;}
  .nav button:disabled{opacity:.4;cursor:default;}
  .atext{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:.9rem;min-height:46px;line-height:1.9;margin-top:10px;}
  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(min-width:520px){.pgrid{grid-template-columns:1fr 1fr 1fr;}}
  .pcell{display:flex;align-items:center;justify-content:center;gap:5px;padding:10px;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font-weight:700;}
  .pcell.sel{border-color:var(--blue);background:#eaf7fd;}
  .pcell.pg{border-color:var(--good);background:#eafaf0;}
  .pcell.pr{border-color:var(--bad);background:#fdeeea;}
  .ball{width:34px;height:34px;border-radius:999px;font-size:.78rem;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid;}
  .ball.red{background:#ef4444;color:#fff;border-color:#b91c1c;}
  .ball.white{background:#fff;color:#374151;border-color:#9ca3af;}
  .presult{margin-top:12px;border-radius:12px;padding:13px;font-size:.9rem;line-height:2;}
  .presult.g{background:#eafaf0;border:1px solid var(--good);}
  .presult.y{background:#fffdf0;border:1px solid var(--yellow);}
  .again{margin-top:8px;font-size:.8rem;background:#fff;border:1px solid var(--line);padding:6px 16px;border-radius:999px;cursor:pointer;}
  @media(max-width:520px){.brand .tag{display:none;} .title-wrap h1{font-size:1.05rem;} .brand img{height:64px;}}
</style>
</head>

<script>
/* ===== 数式（LaTeX / MathJax） ===== */
function tex(s){
  s=s.replace(/×/g,'\\times ').replace(/÷/g,'\\div ').replace(/−/g,'-')
     .replace(/∠/g,'\\angle ').replace(/π/g,'\\pi ').replace(/ℓ/g,'\\ell ')
     .replace(/∥/g,'\\parallel ').replace(/°/g,'^{\\circ}');
  s=s.replace(/cm/g,'\\,\\text{cm}');
  s=s.replace(/[぀-ヿ㐀-鿿]+/g,function(m){return '\\text{'+m+'}';});
  return s;
}
function M(s){return '\\('+tex(s)+'\\)';}
function typeset(el){if(window.MathJax&&MathJax.typesetPromise){try{MathJax.typesetPromise(el?[el]:undefined);}catch(e){}}}

/* ===== 乱数 ===== */
function rand(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmt(n){return String(n).replace(/-/g,'−');}
function rnd(x,d){d=d||3;var p=Math.pow(10,d);return Math.round(x*p)/p;}
function mc(correct,dis){var u=[correct];for(var k=0;k<dis.length;k++){if(u.indexOf(dis[k])<0)u.push(dis[k]);}var n=0;while(u.length<4){u.push(correct+' '.repeat(++n));}var sh=shuffle(u.slice(0,4));return {choices:sh,correct:sh.indexOf(correct)};}

/* ===== 図(SVG文字列) ===== */
function sectorSVG(r,angle,live,target){
  var cx=110,cy=105,R=80,rad=angle*Math.PI/180;
  var ex=cx+R*Math.cos(rad),ey=cy-R*Math.sin(rad),large=angle>180?1:0;
  var ax=cx+22*Math.cos(rad),ay=cy-22*Math.sin(rad);
  var fill=(live&&angle===target)?'#cdeffb':'#eaf7fd',stroke=live?'#1aa3d0':'#2fbdea';
  var s='<svg viewBox="0 0 220 210" width="180" height="172">';
  if(live)s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="#d7e9f2" stroke-width="1" stroke-dasharray="4 4"/>';
  s+='<path d="M '+cx+' '+cy+' L '+(cx+R)+' '+cy+' A '+R+' '+R+' 0 '+large+' 0 '+ex+' '+ey+' Z" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2"/>';
  s+='<text x="'+(cx+26)+'" y="'+(cy-8)+'" font-size="12">'+r+'cm</text>';
  s+='<path d="M '+(cx+22)+' '+cy+' A 22 22 0 '+large+' 0 '+ax+' '+ay+'" fill="none" stroke="#e8624a" stroke-width="1.5"/>';
  s+='<text x="'+(cx-46)+'" y="'+(cy+34)+'" font-size="13" fill="#e8624a" font-weight="bold">'+angle+'°</text>';
  return s+'</svg>';
}
function angleSVG(a,b,stage){
  var sum=a+b,x=(180-sum)/2;
  var s='<svg viewBox="0 0 340 240" width="100%" style="max-width:320px">';
  s+='<line x1="20" y1="40" x2="320" y2="40" stroke="#2b3a45" stroke-width="1.5"/>';
  s+='<line x1="20" y1="200" x2="320" y2="200" stroke="#2b3a45" stroke-width="1.5"/>';
  s+='<text x="8" y="45" font-size="14" font-style="italic">ℓ</text>';
  s+='<text x="8" y="205" font-size="14" font-style="italic">m</text>';
  s+='<polygon points="260,40 280,200 45,120" fill="none" stroke="'+(stage!=null?'#1aa3d0':'#2b3a45')+'" stroke-width="2"/>';
  s+='<text x="258" y="30" font-size="14" font-weight="bold">B</text>';
  s+='<text x="286" y="214" font-size="14" font-weight="bold">C</text>';
  s+='<text x="30" y="118" font-size="14" font-weight="bold">A</text>';
  s+='<path d="M 225 40 A 35 35 0 0 0 227 52" fill="none" stroke="#e8624a" stroke-width="1.5"/>';
  s+='<text x="184" y="60" font-size="13" fill="#e8624a" font-weight="bold">'+a+'°</text>';
  s+='<path d="M 240 200 A 40 40 0 0 1 242 187" fill="none" stroke="#e8624a" stroke-width="1.5"/>';
  s+='<text x="192" y="193" font-size="13" fill="#e8624a" font-weight="bold">'+b+'°</text>';
  if(stage==null){
    s+='<path d="M 263 64 A 24 24 0 0 1 237 48" fill="none" stroke="#e8624a" stroke-width="1.5"/>';
    s+='<text x="233" y="82" font-size="15" fill="#e8624a" font-weight="bold" font-style="italic">x</text>';
  }else{
    if(stage>=1)s+='<line x1="20" y1="120" x2="320" y2="120" stroke="#8dc63f" stroke-width="2" stroke-dasharray="6 4"/>';
    if(stage>=2){s+='<text x="80" y="112" font-size="11" fill="#5e9022" font-weight="bold">'+a+'°(錯角)</text>';s+='<text x="80" y="136" font-size="11" fill="#5e9022" font-weight="bold">'+b+'°(錯角)</text>';s+='<text x="126" y="100" font-size="12" fill="#e8624a" font-weight="bold">∠BAC = '+sum+'°</text>';}
    if(stage>=3){s+='<path d="M 263 64 A 24 24 0 0 1 237 48" fill="none" stroke="#1aa3d0" stroke-width="1.5"/>';s+='<text x="228" y="82" font-size="12" fill="#1aa3d0" font-weight="bold">'+x+'°</text>';s+='<text x="236" y="178" font-size="13" fill="#1aa3d0" font-weight="bold">x = '+x+'°</text>';}
  }
  return s+'</svg>';
}
function bagSVG(){
  return '<svg viewBox="0 0 220 170" width="160" height="124">'+
  '<path d="M 70 30 Q 60 10 85 15 L 135 15 Q 160 10 150 30 Q 190 60 185 110 Q 182 155 110 158 Q 38 155 35 110 Q 30 60 70 30 Z" fill="#fffdf0" stroke="#8a7400" stroke-width="2"/>'+
  '<path d="M 70 30 Q 110 42 150 30" fill="none" stroke="#8a7400" stroke-width="2"/>'+
  '<circle cx="80" cy="80" r="20" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/><text x="80" y="85" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">赤①</text>'+
  '<circle cx="135" cy="75" r="20" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/><text x="135" y="80" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">赤②</text>'+
  '<circle cx="90" cy="125" r="20" fill="#fff" stroke="#6b7280" stroke-width="2"/><text x="90" y="130" font-size="11" fill="#374151" text-anchor="middle" font-weight="bold">白①</text>'+
  '<circle cx="140" cy="120" r="20" fill="#fff" stroke="#6b7280" stroke-width="2"/><text x="140" y="125" font-size="11" fill="#374151" text-anchor="middle" font-weight="bold">白②</text></svg>';
}
function quadSVG(step){
  var s='<svg viewBox="0 0 350 280" width="100%" style="max-width:320px">';
  s+='<polygon points="120,40 280,120 310,250 40,250" fill="#eaf7fd" stroke="#2b3a45" stroke-width="2"/>';
  s+='<text x="110" y="32" font-size="14" font-weight="bold">A</text><text x="286" y="115" font-size="14" font-weight="bold">D</text>';
  s+='<text x="316" y="260" font-size="14" font-weight="bold">C</text><text x="22" y="260" font-size="14" font-weight="bold">B</text>';
  if(step==null){
    s+='<path d="M 70 160 Q 110 190 130 235" fill="none" stroke="#e8624a" stroke-width="1.5" stroke-dasharray="5 4"/>';
    s+='<text x="42" y="150" font-size="11" fill="#e8624a">辺ABを辺BCに</text><text x="42" y="164" font-size="11" fill="#e8624a">重ねるように折る</text>';
  }else{
    if(step>=1){s+='<path d="M 109.3 259.7 A 70 70 0 0 0 54.6 181.5" fill="none" stroke="#e8624a" stroke-width="1.5"/><circle cx="110" cy="250" r="4" fill="#e8624a"/><circle cx="64.9" cy="184.6" r="4" fill="#e8624a"/>';}
    if(step>=2){s+='<path d="M 143.6 200.3 A 60 60 0 0 0 103.7 190.3" fill="none" stroke="#f7b500" stroke-width="1.5"/><path d="M 118.4 211.8 A 60 60 0 0 0 123.4 171.1" fill="none" stroke="#f7b500" stroke-width="1.5"/><text x="124.5" y="197.5" font-size="16" fill="#f7b500" text-anchor="middle" font-weight="bold">★</text>';}
    if(step>=3){s+='<line x1="40" y1="250" x2="280" y2="84" stroke="#e8624a" stroke-width="2" stroke-dasharray="7 4"/>';}
    if(step>=4){s+='<circle cx="250" cy="105" r="6" fill="#e8624a"/><text x="243" y="93" font-size="15" font-weight="bold" fill="#e8624a">P</text>';}
  }
  return s+'</svg>';
}
function figureHTML(p){
  var svg='';
  if(p.figure==='sector')svg=sectorSVG(p.fp.r,p.fp.theta,false,0);
  else if(p.figure==='angle')svg=angleSVG(p.fp.a,p.fp.b,null);
  else if(p.figure==='bag')svg=bagSVG();
  else if(p.figure==='quad')svg=quadSVG(null);
  else return '';
  return '<div class="figbox"><p>【問題の図】</p>'+svg+'</div>';
}

/* ===== 問題ジェネレータ ===== */

/* ===== 状態 & 描画 ===== */
var problems=build(),done={},total=0,cst={};
function stOf(id){if(!cst[id])cst[id]={open:false,sel:null,step:-1};return cst[id];}
var LB=['A','B','C','D'];

function cardHTML(p){
  var st=stOf(p.id),isDone=!!done[p.id];
  var h='<div class="card'+(isDone?' done':'')+'" data-card="'+p.id+'">';
  h+='<button class="chead" data-act="toggle" data-id="'+p.id+'"><span class="num">'+(isDone?'✓':p.id)+'</span><span class="q">'+p.q+'</span><span class="caret">'+(st.open?'▲':'▼')+'</span></button>';
  if(st.open){
    h+='<div class="cbody">';
    if(p.figure)h+=figureHTML(p);
    var answered=st.sel!==null;
    h+='<p class="lead">🤔 まずは自分で選んでみよう！</p><div class="choices">';
    for(var i=0;i<p.choices.length;i++){
      var cls='choice';
      if(answered){if(i===p.correct)cls+=' ok';else if(i===st.sel)cls+=' ng';else cls+=' dim';}
      var mk='';
      if(answered&&i===p.correct)mk='<span class="mark g">✓</span>';
      else if(answered&&i===st.sel&&i!==p.correct)mk='<span class="mark r">✗</span>';
      h+='<button class="'+cls+'" '+(answered?'disabled':'')+' data-act="choice" data-id="'+p.id+'" data-i="'+i+'"><span class="lb">'+LB[i]+'</span>'+M(p.choices[i])+mk+'</button>';
    }
    h+='</div>';
    if(answered){
      var ok=st.sel===p.correct;
      h+='<p class="verdict '+(ok?'g':'r')+'">'+(ok?'🎉 正解！ステップ解説で解き方も確認しよう。':'残念…！ステップ解説でしっかり理解しよう。')+'</p>';
      h+='<div class="steps"><p class="t">💡 ステップ解説</p>';
      for(var k=0;k<=st.step;k++){h+='<div class="step"><span class="n">'+(k+1)+'</span><span>'+p.steps[k]+'</span></div>';}
      var allSteps=st.step>=p.steps.length-1;
      if(!allSteps){h+='<button class="btn" data-act="step" data-id="'+p.id+'">'+(st.step===-1?'ステップ 1 を見る':'次のステップ（'+(st.step+2)+'/'+p.steps.length+'）')+'</button>';}
      else{h+='<div class="ansbox"><span class="mark g">🎯</span><b>答え：'+p.answer+'</b></div>';}
      h+='</div>';
      if(allSteps&&p.diagram)h+='<div class="dia" data-type="'+p.diagram+'"'+(p.fp?(' data-r="'+(p.fp.r||'')+'" data-target="'+(p.fp.theta||'')+'" data-a="'+(p.fp.a||'')+'" data-b="'+(p.fp.b||'')+'"'):'')+'></div>';
      if(allSteps&&!isDone)h+='<button class="donebtn" data-act="done" data-id="'+p.id+'">🏆 理解できた！</button>';
    }
    h+='</div>';
  }
  h+='</div>';
  return h;
}
function renderAll(){
  var s1='',s2='';
  problems.forEach(function(p){if(p.section===1)s1+=cardHTML(p);else s2+=cardHTML(p);});
  document.getElementById('s1').innerHTML=s1;
  document.getElementById('s2').innerHTML=s2;
  problems.forEach(function(p){var el=document.querySelector('[data-card="'+p.id+'"]');if(el)initDia(el);});
  refreshHeader();
  typeset(document.getElementById('panel-s1'));typeset(document.getElementById('panel-s2'));
}
function remount(p){
  var el=document.querySelector('[data-card="'+p.id+'"]');
  if(!el)return;
  var tmp=document.createElement('div');tmp.innerHTML=cardHTML(p);
  el.replaceWith(tmp.firstChild);
  var ne=document.querySelector('[data-card="'+p.id+'"]');
  initDia(ne);typeset(ne);
}
function refreshHeader(){
  var n=0;for(var k in done)if(done[k])n++;
  var pct=Math.round(n/problems.length*100);
  document.getElementById('pinfo').textContent=n+' / '+problems.length+' 問（'+pct+'%）　累計 '+total+' 問';
  document.getElementById('pbar').style.width=pct+'%';
  document.getElementById('clear').innerHTML = pct===100 ? '<div class="clear"><p style="font-size:2.4rem;margin:0">🏆</p><p style="font-weight:800;color:var(--green-d);margin:6px 0">このセット全問クリア！おつかれさま！</p><p style="font-size:.85rem;color:var(--muted);margin:0">「数字を変えて新しい問題に挑戦」でもう一度！</p></div>' : '';
}

function initCons(d){

  d.innerHTML='<p class="wtitle">📐 コンパスの手順を１つずつ（ステップ <span class="sn">1</span>/5）</p><div class="asvg" style="text-align:center"></div><div class="atext"></div><div class="nav"><button class="prev">◀ 戻る</button><button class="next">次へ ▶</button></div>';
  var svg=d.querySelector('.asvg'),tx=d.querySelector('.atext'),sn=d.querySelector('.sn'),pv=d.querySelector('.prev'),nx=d.querySelector('.next');
  function upd(){svg.innerHTML=quadSVG(step);tx.textContent=steps[step];sn.textContent=step+1;pv.disabled=step===0;nx.disabled=step===4;}
  pv.addEventListener('click',function(){if(step>0){step--;upd();}});
  nx.addEventListener('click',function(){if(step<4){step++;upd();}});
  upd();
}
function initProb(d){
  var pairs=[{a:'赤①',b:'赤②',red:true},{a:'赤①',b:'白①',red:true},{a:'赤①',b:'白②',red:true},{a:'赤②',b:'白①',red:true},{a:'赤②',b:'白②',red:true},{a:'白①',b:'白②',red:false}];
  var sel={},checked=false;
  function ball(l){return '<span class="ball '+(l.charAt(0)==='赤'?'red':'white')+'">'+l+'</span>';}
  function render(){
    var h='<p class="wtitle">👆 「赤球を少なくとも1個ふくむ」組み合わせを全部タップしてから答え合わせ!</p><div class="pgrid">';
    pairs.forEach(function(p,i){var cls='pcell';if(checked){cls+=p.red?' pg':' pr';}else if(sel[i])cls+=' sel';h+='<button class="'+cls+'" data-p="'+i+'">'+ball(p.a)+ball(p.b)+(checked&&p.red?' ✓':'')+'</button>';});
    h+='</div>';
    if(!checked){h+='<button class="btn" style="margin-top:12px" data-check="1">答え合わせする</button>';}
    else{var ok=pairs.every(function(p,i){return !!sel[i]===p.red;});
      h+='<div class="presult '+(ok?'g':'y')+'"><b>'+(ok?'🎉 正解！':'おしい！緑色が赤球をふくむ組み合わせだよ。')+'</b><br>全 6 通りのうち赤をふくむのは <b>5 通り</b> →確率は <b>'+M('\\frac{5}{6}')+'</b>。<br>「2個とも白」は 1 通りだけなので '+M('1 − \\frac{1}{6} = \\frac{5}{6}')+' と<b>余事象</b>で計算するのが速い！<br><button class="again" data-reset="1">↺ もう一度</button></div>';}
    d.innerHTML=h;wire();typeset(d);
  }
  function wire(){
    d.querySelectorAll('[data-p]').forEach(function(bt){bt.addEventListener('click',function(){if(checked)return;var i=+bt.dataset.p;sel[i]=!sel[i];render();});});
    var cb=d.querySelector('[data-check]');if(cb)cb.addEventListener('click',function(){checked=true;render();});
    var rs=d.querySelector('[data-reset]');if(rs)rs.addEventListener('click',function(){checked=false;sel={};render();});
  }
  render();
}

/* ===== イベント ===== */
document.body.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var act=t.dataset.act,id=t.dataset.id,p=null;
  for(var i=0;i<problems.length;i++)if(problems[i].id===id){p=problems[i];break;}
  if(act==='toggle'){stOf(id).open=!stOf(id).open;remount(p);}
  else if(act==='choice'){var st=stOf(id);if(st.sel!==null)return;st.sel=+t.dataset.i;remount(p);}
  else if(act==='step'){stOf(id).step++;remount(p);}
  else if(act==='done'){if(!done[id]){done[id]=true;total++;}remount(p);refreshHeader();}
});
document.getElementById('reroll').addEventListener('click',function(){
  problems=build();done={};cst={};renderAll();window.scrollTo({top:0,behavior:'smooth'});
});
/* タブ切替 */
document.querySelectorAll('.tab').forEach(function(tb){
  tb.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
    document.querySelectorAll('.panel').forEach(function(x){x.classList.remove('active');});
    tb.classList.add('active');
    document.getElementById('panel-'+tb.dataset.tab).classList.add('active');
  });
});
renderAll();
if(window.MathJax&&MathJax.startup&&MathJax.startup.promise){MathJax.startup.promise.then(function(){typeset();});}
